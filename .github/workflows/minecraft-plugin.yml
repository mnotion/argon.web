name: Build Minecraft Application Plugin
on:
  push:
    branches: [minecraft-application-plugin]
    paths:
      - 'minecraft-plugin/**'
      - '.github/workflows/minecraft-plugin.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        working-directory: minecraft-plugin
        run: mvn --batch-mode clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: argon-applications
          path: minecraft-plugin/target/argon-applications-*.jar
          if-no-files-found: error
