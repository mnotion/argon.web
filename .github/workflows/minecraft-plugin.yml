name: Build Minecraft Application Plugin
on:
  push:
    branches: [minecraft-application-plugin]
    paths:
      - 'minecraft-plugin/**'
      - '.github/workflows/minecraft-plugin.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        working-directory: minecraft-plugin
        run: mvn --batch-mode clean package
      - name: Commit compiled JAR to branch
        run: |
          cp minecraft-plugin/target/argon-applications-*.jar minecraft-plugin/argon-applications.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft-plugin/argon-applications.jar
          git commit -m "Build Minecraft application plugin JAR" || exit 0
          git push
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: argon-applications
          path: minecraft-plugin/target/argon-applications-*.jar
          if-no-files-found: error
