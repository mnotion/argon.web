<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#252525"><meta name="description" content="Connect to the argon minecraft server on java or bedrock."><title>argon — minecraft server</title><link rel="stylesheet" href="styles.css?v=8"></head><body>

<main>
<section class="servers" aria-label="server addresses"><div class="server java"><h2>Java</h2><button class="copy-unit address java-copy" type="button" data-copy="argon.serv.lol" aria-label="Copy Java server address"><span class="java-copy__text">argon.serv.lol</span><span class="java-copy__icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h1"/></svg></span></button><button class="copy-unit port java-copy" type="button" data-copy="10134" aria-label="Copy Java port"><span class="java-copy__text">Port: 10134</span><span class="port-info" aria-hidden="true">You don’t need the port for Java!</span><span class="java-copy__icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h1"/></svg></span></button><a class="launch java-launch" href="minecraft://">Play on Java</a></div>
<div class="server bedrock"><h2>Bedrock</h2><div class="bedrock-details"><button class="copy-unit address bedrock-copy" type="button" data-copy="argon.serv.lol"><span class="copy-label">argon.serv.lol</span><span class="copy-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h1"/></svg></span></button><button class="copy-unit port bedrock-copy" type="button" data-copy="3045"><span class="copy-label">Port: 3045</span><span class="copy-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h1"/></svg></span></button></div><a class="launch" href="minecraft://?addExternalServer=argon,argon.serv.lol:3045">Play on Bedrock</a></div></section></main>
<button class="apply-fab" id="open-apply" type="button" aria-label="Open whitelist application">＋</button>
<div class="apply-overlay" id="apply-overlay" aria-hidden="true">
<div class="apply-card-wrap">
<section class="apply-panel" role="dialog" aria-modal="true" aria-labelledby="apply-title">
<button class="apply-close" id="close-apply" type="button" aria-label="Close form">×</button>

<div class="application-layout"><div class="application-content">
<h1 id="apply-title">get Whitelisted</h1>
<form class="application-form" action="https://formsubmit.co/argonmcadmin@gmail.com" method="POST">
<input type="hidden" name="_subject" value="New Argon whitelist request"><input type="hidden" name="_template" value="table"><input type="hidden" name="_captcha" value="true"><input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
<label>mc Username<input name="Minecraft Username" required maxlength="32" placeholder="your minecraft Username"></label>
<label>actual name<input name="Applicant Name" required placeholder="your name"></label>
<label>Email<input type="email" name="email" required placeholder="you@example.com"></label>
<label>Discord user <span class="optional">(optional)</span><input name="Discord user" placeholder="Discord Username"></label>

<button type="submit">send whitelist request</button></form></div></div></section>
<button class="apply-help" type="button" aria-label="Application information"><span>i</span><span class="apply-help-tip">Pls provide your real email because the app will still say "Submitted!" and I won't be able to see your email, so the application is obsolete<br><br>Also, write your real name or otherwise it's gonna be a long process sending you quesitons on gmail to confirm or whatever<br><br>And right username too<br><br>Thx</span></button>
</div></div>
<script src="script.js?v=8" defer></script></body></html>
