<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <meta name="description" content="Connect to the Argon Minecraft server on Java or Bedrock.">
  <title>Argon — Minecraft Server</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10110f;
      --panel: #191b17;
      --text: #f3f3ed;
      --muted: #a0a398;
      --accent: #c6a96a;
      --border: #303329;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 520px); text-align: center; }
    .brand { color: var(--accent); font-size: 18px; letter-spacing: -1px; margin-bottom: 18px; }
    h1 { margin: 0 0 32px; font-size: clamp(34px, 8vw, 54px); letter-spacing: -0.06em; font-weight: 600; }
    .servers { display: grid; gap: 14px; }
    .server {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }
    h2 { margin: 0 0 12px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
    .address { font-size: clamp(19px, 5vw, 24px); font-weight: 500; letter-spacing: -.03em; overflow-wrap: anywhere; }
    .port { margin-top: 8px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-hidden="true">{Ar}</div>
    <h1>Join Argon</h1>
    <section class="servers" aria-label="Server addresses">
      <div class="server">
        <h2>Java Edition</h2>
        <div class="address">argon.serv.lol</div>
      </div>
      <div class="server">
        <h2>Bedrock Edition</h2>
        <div class="address">argon.serv.lol</div>
        <div class="port">Port: 3045</div>
      </div>
    </section>
  </main>
</body>
</html>
