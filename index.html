<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <meta name="description" content="Connect to the argon minecraft server on java or bedrock.">
  <title>argon — minecraft server</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10110f;
      --panel: #191b17;
      --text: #f3f3ed;
      --muted: #a0a398;
      --accent: #c6a96a;
      --border: #303329;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 520px); text-align: center; }
    .servers { display: grid; gap: 14px; }
    .server {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }
    h2 { margin: 0 0 12px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: lowercase; }
    .copy-unit {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      cursor: pointer;
      overflow-wrap: anywhere;
    }
    .address { font-size: clamp(19px, 5vw, 24px); font-weight: 500; letter-spacing: -.03em; }
    .port { margin-top: 8px; color: var(--muted); font-size: 14px; }
    .copy-unit:hover { color: var(--accent); }
    .copy-unit:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; border-radius: 4px; }
    #toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 18px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 8px 30px #0005;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
  </style>
</head>
<body>
  <div id="toast" role="status" aria-live="polite">copied!</div>
  <main>
    <section class="servers" aria-label="server addresses">
      <div class="server">
        <h2>java edition</h2>
        <button class="copy-unit address" type="button" data-copy="argon.serv.lol" aria-label="copy java server address">argon.serv.lol</button>
      </div>
      <div class="server">
        <h2>bedrock edition</h2>
        <button class="copy-unit address" type="button" data-copy="argon.serv.lol" aria-label="copy bedrock server address">argon.serv.lol</button>
        <button class="copy-unit port" type="button" data-copy="3045" aria-label="copy bedrock port">Port: 3045</button>
      </div>
    </section>
  </main>
  <script>
    const toast = document.getElementById('toast');
    let toastTimer;
    document.querySelectorAll('[data-copy]').forEach((button => {
      button.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(button.dataset.copy);
          toast.classList.add('show');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
        } catch {
          toast.textContent = 'copy failed';
          toast.classList.add('show');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            toast.classList.remove('show');
            toast.textContent = 'copied!';
          }, 1800);
        }
      });
    });
  </script>
</body>
</html>
