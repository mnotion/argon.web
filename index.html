<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#252525"><meta name="description" content="Connect to the argon minecraft server on java or bedrock."><title>argon — minecraft server</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="toast" role="status" aria-live="polite">copied!</div>
<a class="useless-button" href="https://theuselessweb.com/" target="_blank" rel="noopener noreferrer" aria-label="Open a random useless website" title="Surprise me">?</a><main>
<section class="servers" aria-label="server addresses"><div class="server java"><h2>Java</h2><button class="copy-unit address" type="button" data-copy="argon.serv.lol">argon.serv.lol</button></div>
<div class="server bedrock"><h2>Bedrock</h2><div class="bedrock-details"><button class="copy-unit address" type="button" data-copy="argon.serv.lol">argon.serv.lol</button><button class="copy-unit port" type="button" data-copy="3045">Port: 3045</button></div><a class="launch" href="minecraft://?addExternalServer=argon,argon.serv.lol:3045">Play on Bedrock</a></div></section><div class="earth-scene" aria-label="A rotating Earth in space"><div class="earth-stars" aria-hidden="true"><i id="star-1">✦</i><i id="star-2">✦</i><i id="star-3">✦</i><i id="star-4">✦</i><i id="star-5">✦</i><i id="star-6">✦</i><i id="star-7">✦</i></div><div class="section-banner" role="img" aria-label="Rotating planet Earth"></div></div></main>
<button class="apply-fab" id="open-apply" type="button" aria-label="Open whitelist application">＋</button>
<div class="apply-overlay" id="apply-overlay" aria-hidden="true">
<section class="apply-panel" role="dialog" aria-modal="true" aria-labelledby="apply-title">
<button class="apply-close" id="close-apply" type="button" aria-label="Close form">×</button>
<h1 id="apply-title">Get whitelisted</h1>
<form class="application-form" action="https://formsubmit.co/YOUR_EMAIL_HERE" method="POST">
<input type="hidden" name="_subject" value="New Argon whitelist request"><input type="hidden" name="_template" value="table"><input type="hidden" name="_captcha" value="true"><input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
<label>MC Username<input name="MC Username" required maxlength="32" placeholder="Your Minecraft username"></label>
<label>Actual name<input name="Actual name" required placeholder="Your name"></label>
<label>Email<input type="email" name="email" required placeholder="you@example.com"></label>
<label>Discord user <span class="optional">(optional)</span><input name="Discord user" placeholder="Discord username"></label>
<label>How should we confirm your identity?<select id="identity-confirmation" name="Identity confirmation" required><option value="" disabled selected>Select a method</option><option>Discord message</option><option>In-game chat</option><option>Email</option><option value="Other">Other</option></select></label>
<label id="identity-other-wrap" hidden>(other)<textarea id="identity-other" name="Other identity confirmation" rows="3" placeholder="Other"></textarea></label>
<button type="submit">Send whitelist request</button></form></section></div>
<script src="script.js" defer></script></body></html>
