name: ArgonApplications
version: 0.4.0
main: com.argon.applications.ArgonApplications
api-version: '1.21'
softdepend: [floodgate]
commands:
  app:
    description: Manage the Argon player whitelist and applications
    usage: /app <list|approve|whitelist|remove|reject>
  afk:
    description: Toggle AFK protection
    usage: /afk
  colour:
    description: Set the colour of your chat name
    usage: /colour <colour>
    aliases: [color]
  send:
    description: Submit your real first name for an Argon application
    usage: /send <your real first name>
permissions:
  argonapplications.admin:
    default: op
  argonapplications.bypass:
    default: op
